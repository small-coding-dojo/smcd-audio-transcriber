[project]
name = "smcd-audio-transcriber"
version = "0.1.0"
description = "ClearVoice audio transcriber service — accepts an uploaded audio file and returns a structured, timestamped, speaker-diarised transcript."
authors = [
    { name = "Eudicy", email = "eudicy@boos.systems" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
]

[project.scripts]
smcd-audio-transcriber = "smcd_audio_transcriber:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
